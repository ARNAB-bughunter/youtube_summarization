services:
  rabbitmq-server:
    image: "rabbitmq:3.12-management"
    container_name: rabbitmq-server
    networks:
      - default
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  audio_extraction_service:
    build:
      context: ../services/audio_extractor/ 
      dockerfile: Dockerfile
    image: audio_extraction_service
    container_name: audio_extraction_service
    networks:
      - default
    volumes:
      - /home/user/workspace/my_test/youtube_summarize/backend:/mnt/audio_files:rw
      - /home/user/workspace/my_test/youtube_summarize/config_audio_extractor.yaml:/audio_extractor/config/config.yaml
    depends_on:
      rabbitmq-server:
        condition: service_healthy
    
  speech_to_text:
    build:
      context: ../services/speech_to_text/ 
      dockerfile: Dockerfile
    image: speech_to_text
    container_name: speech_to_text
    networks:
      - default
    volumes:
      - /home/user/workspace/my_test/youtube_summarize/backend:/mnt/audio_files:rw
      - /home/user/workspace/my_test/youtube_summarize/config_speech_to_text.yaml:/speech_to_text/config/config.yaml
    depends_on:
      rabbitmq-server:
        condition: service_healthy

networks:
  default:
    name: youtube_summarize
    driver: bridge